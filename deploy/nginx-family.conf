# ⚠️ 本文件【未启用 / 仅供参考】。
# 2026-08-21 SSH 实测：服务器 80/443 上既不是 nginx 也不是 Caddy，
# 本文件与 deploy/Caddyfile 均为 QC 仓库里的死配置，从未运行。
# 真正的入口是 QC 自写 Node 反代（pm2 `reverse-proxy`，/path/to/qc/proxy-lcgcy-443.js）。
# 赛博家谱的实际接入方式见 deploy/PROXY_INTEGRATION.md（改反代 Host 分流 + 扩证书）。
# ─────────────────────────────────────────────────────────────

# HTTP(80)：仅用于 ACME 验证 + 301 跳 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS(443)：终止 TLS → 反代到 localhost:4000
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 兼容未来 WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
